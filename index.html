    function render() {
        const grid = document.getElementById('bookGrid');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        
        const filtered = inventory.filter(book => {
            const matchesSearch = 
                book.title.toLowerCase().includes(searchTerm) || 
                book.title_hi.includes(searchTerm) ||
                book.author.toLowerCase().includes(searchTerm) ||
                book.exam.toLowerCase().includes(searchTerm) ||
                book.publisher.toLowerCase().includes(searchTerm);

            const examList = book.exam.split(',').map(e => e.trim());
            const matchesFilter = (currentFilter === 'All' || examList.includes(currentFilter));

            return matchesSearch && matchesFilter;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-grid">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                    <p style="font-size: 16px; margin-top: 12px;">No books found</p>
                    <p style="font-size: 14px; color: #999; margin-top: 4px;">Try adjusting your search or filters</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = filtered.map(book => {
            const isInCart = cart.some(item => item.id === book.id);
            return `
                <div class="card" role="listitem">
                    <div class="img-wrap">
                        <img src="https://drive.google.com/thumbnail?id=${book.img}&sz=w400" 
                             alt="${book.title}" 
                             loading="lazy"
                             onerror="this.src='https://via.placeholder.com/300x420/e8eef3/636366?text=No+Image'">
                    </div>
                    <div class="card-meta">
                        <span class="exam-tag">${book.exam}</span>
                        <span class="title-hi">${book.title_hi}</span>
                        <div class="title-author-row">
                            <span class="title-en" title="${book.title}">${book.title}</span>
                            <span class="author">• ${book.author.split(',')[0]}</span>
                        </div>
                        <span class="book-id">Merit ID: #${book.id}</span>
                    </div>
                    <div class="card-footer">
                        <div class="price-tag">₹${book.price.toFixed(0)}</div>
                        <button class="add-btn ${isInCart ? 'in-cart' : ''}" 
                                onclick="toggleInCart(${book.id})"
                                aria-label="${isInCart ? 'Remove from cart' : 'Add to cart'}">
                            ${isInCart ? 
                                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>' : 
                                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>'
                            }
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function setFilter(cat, btn) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        render();
    }

    function toggleInCart(id) {
        const index = cart.findIndex(item => item.id === id);
        if (index > -1) {
            cart.splice(index, 1);
        } else {
            const book = inventory.find(b => b.id === id);
            if (book) cart.push(book);
        }
        localStorage.setItem('meritCart', JSON.stringify(cart));
        updateCartUI();
        render();
    }

    function updateCartUI() {
        const count = cart.length;
        document.getElementById('cartCountDesktop').innerText = count;
        const mobileBadge = document.getElementById('mobileBadge');
        mobileBadge.innerText = count;
        mobileBadge.style.display = count > 0 ? 'block' : 'none';

        const list = document.getElementById('cartList');
        if (count === 0) {
            list.innerHTML = `<div class="empty-state">Your bag is empty</div>`;
        } else {
            list.innerHTML = cart.map(item => `
                <div class="cart-item" role="listitem">
                    <img src="https://drive.google.com/thumbnail?id=${item.img}&sz=w100" 
                         alt="${item.title}"
                         loading="lazy"
                         onerror="this.src='https://via.placeholder.com/50x70/e8eef3/636366?text=?'">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.title_hi}</div>
                        <div class="cart-item-id">Merit ID: #${item.id}</div>
                        <div class="cart-item-price">₹${item.price.toFixed(0)}</div>
                    </div>
                    <div onclick="toggleInCart(${item.id})" 
                         class="cart-item-remove"
                         role="button"
                         tabindex="0"
                         aria-label="Remove ${item.title_hi} from cart">Remove</div>
                </div>
            `).join('');
        }

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('totalPrice').innerText = `₹${total.toFixed(0)}`;
    }

    function toggleCart() {
        const drawer = document.getElementById('cartDrawer');
        const overlay = document.getElementById('overlay');
        const isOpen = drawer.classList.contains('show');
        
        drawer.classList.toggle('show');
        overlay.classList.toggle('show');
        
        // Prevent body scroll when cart is open
        document.body.style.overflow = isOpen ? '' : 'hidden';
        
        // Accessibility
        drawer.setAttribute('aria-hidden', isOpen ? 'true' : 'false');
        overlay.setAttribute('aria-hidden', isOpen ? 'true' : 'false');
    }

    function sendToWhatsApp() {
        if (cart.length === 0) {
            alert('Your bag is empty. Please add some books first.');
            return;
        }
        
        let text = `*New Order from Merit Book House*\n${'─'.repeat(30)}\n\n`;
        cart.forEach((item, idx) => {
            text += `${idx + 1}. *${item.title_hi}*\n`;
            text += `   Merit ID: #${item.id}\n`;
            text += `   Price: ₹${item.price.toFixed(0)}\n\n`;
        });
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        text += `${'─'.repeat(30)}\n`;
        text += `*Total Amount: ₹${total.toFixed(0)}*\n\n`;
        text += `Please confirm my order. Thank you! 📚`;
        
        const wpUrl = `https://wa.me/919829000000?text=${encodeURIComponent(text)}`;
        window.open(wpUrl, '_blank');
    }

    // Keyboard navigation for cart
    document.addEventListener('keydown', (e) => {
        const drawer = document.getElementById('cartDrawer');
        if (e.key === 'Escape' && drawer.classList.contains('show')) {
            toggleCart();
        }
    });

    // Initialize
    updateCartUI();
    render();
</script>

</body>
</html>
